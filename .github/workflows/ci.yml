name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, vet, test, race, govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify clean working tree (no whitespace errors)
        run: git diff --check

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: go mod verify
        run: make mod-verify

      - name: go mod tidy check
        run: make tidy-check

      - name: go test
        run: make test

      - name: go test -race
        run: make test-race

      - name: govulncheck
        uses: golang/govulncheck-action@b625fbe770f3cfe4bf29bea45caac5ba280045b3 # v1.0.5
        with:
          go-version-file: go.mod

  plugin-validity:
    name: Plugin manifests (schema + compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be7b907ab1ce9b6c7f5e4a0c6e0c5e8b1 # v5.6.0
        with:
          python-version: '3.x'
      - name: Plugin manifest + wrapper syntax
        run: make plugin-syntax-check
      - name: Codex manifest schema validation
        run: |
          python3 -c "
          import json, sys
          m = json.load(open('plugins/codex/.codex-plugin/plugin.json'))
          # Top-level required fields.
          for key in ('name', 'version', 'description', 'author'):
              assert key in m, f'missing top-level {key}'
          # Skills path must be present.
          assert 'skills' in m, 'missing skills path'
          # Allowed top-level keys for Codex plugins. Codex 0.145+ supports a
          # top-level 'hooks' field pointing at hooks.json; auto-discovery of
          # the default './hooks/hooks.json' path is also valid, in which case
          # the field may be omitted. Both forms are accepted.
          allowed_top = {'name', 'version', 'description', 'author', 'skills', 'interface', 'hooks'}
          unsupported = set(m.keys()) - allowed_top
          assert not unsupported, f'unsupported top-level field(s): {unsupported}'
          # If hooks is declared, it must be a string path.
          if 'hooks' in m:
              assert isinstance(m['hooks'], str) and m['hooks'].strip(), 'hooks must be a non-empty string path'
          # Interface metadata is required by the current Codex plugin contract.
          iface = m.get('interface', {})
          allowed_iface = {'displayName', 'shortDescription', 'longDescription', 'developerName', 'category', 'capabilities', 'defaultPrompt'}
          unsupported_iface = set(iface.keys()) - allowed_iface
          assert not unsupported_iface, f'unsupported interface field(s): {unsupported_iface}'
          for key in allowed_iface:
              assert key in iface, f'missing interface.{key}'
          assert isinstance(iface['capabilities'], list) and len(iface['capabilities']) > 0, 'capabilities must be a non-empty list'
          assert isinstance(iface['defaultPrompt'], list) and len(iface['defaultPrompt']) > 0, 'defaultPrompt must be a non-empty list'
          # hooks/hooks.json must exist if hooks are referenced (either explicitly or by default).
          import os
          default_hooks = 'hooks/hooks.json'
          if 'hooks' in m:
              hook_path = m['hooks']
              assert os.path.isfile(hook_path), f'hooks path {hook_path} does not exist'
          else:
              assert os.path.isfile(default_hooks), f'default {default_hooks} must exist for Codex auto-discovery'
          print('Codex manifest satisfies the current plugin contract.')
          "

  bench:
    name: Benchmarks (latency gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run latency benchmarks
        run: make bench-ci

  build-static:
    name: Static build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Static build with ldd verification
        run: make build
      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: freeinference-linux-amd64
          path: build/freeinference
          if-no-files-found: error

  cross-build:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.target }}
        run: make build-${{ matrix.target }}
      - name: Verify static linkage
        run: |
          file build/freeinference-${{ matrix.target }}
          if file build/freeinference-${{ matrix.target }} | grep -q "dynamically linked"; then
            echo "error: ${{ matrix.target }} binary is dynamically linked"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: freeinference-${{ matrix.target }}
          path: build/freeinference-${{ matrix.target }}
          if-no-files-found: error

  pr-packaging:
    name: Packaging (PR validation)
    needs:
      - lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build test artifacts
        run: |
          VERSION=0.0.0 make package
      - name: Validate archive contents
        run: |
          set -euo pipefail
          for f in release/*.tar.gz; do
            echo "Checking $f"
            tar tzf "$f" | head -5
          done
          # SBOM and provenance must be generated
          test -f release/sbom.spdx.json
          test -f release/provenance.intoto.jsonl
      - name: Upload artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-artifacts-pr
          path: release/
          if-no-files-found: warn

  pr-plugin-clean-install:
    name: Plugin clean-install smoke (PR)
    needs:
      - lint-and-test
      - pr-packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build package + plugin clean-install smoke
        run: |
          VERSION=0.0.0 make plugin-clean-install

  release-build:
    name: Release build (${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate tag is semver
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: tag '$tag' is not a valid semver (expected v0.2.0)"
            exit 1
          fi
          echo "Tag validated: $tag"

      - name: Build release binaries
        run: make build-all build

      - name: Verify static linkage of all binaries
        run: |
          set -euo pipefail
          for b in build/freeinference build/freeinference-linux-amd64 build/freeinference-linux-arm64 build/freeinference-darwin-amd64 build/freeinference-darwin-arm64; do
            file "$b"
            if file "$b" | grep -q "dynamically linked"; then
              echo "error: $b is dynamically linked"
              exit 1
            fi
          done

      - name: Package release artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}" make package
        env:
          VERSION: "${{ github.ref_name }}"

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          ls -la release/
          test -f release/sbom.spdx.json || { echo 'missing SBOM'; exit 1; }
          test -f release/provenance.intoto.jsonl || { echo 'missing provenance'; exit 1; }
          test -f release/checksums.txt || { echo 'missing checksums'; exit 1; }
          shopt -s nullglob
          zips=(release/*.zip)
          tars=(release/*.tar.gz)
          test ${#zips[@]} -ge 2 || { echo 'missing plugin zips'; exit 1; }
          test ${#tars[@]} -ge 4 || { echo 'missing source archives'; exit 1; }
          # Verify VERSION appears in archive names
          if ! ls release/*.tar.gz | head -1 | grep -q "${GITHUB_REF_NAME#v}"; then
            echo "error: archive names do not contain the version $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v2.0.0
        with:
          files: release/*
          draft: true

  release:
    name: Release (on tag)
    needs:
      - lint-and-test
      - plugin-validity
      - build-static
      - cross-build
      - bench
      - release-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Confirm release-build succeeded
        run: echo "release-build job verified tag-versioned artifacts"
