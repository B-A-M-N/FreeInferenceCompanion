name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, vet, test, race, govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify clean working tree (no whitespace errors)
        run: git diff --check

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: go mod verify
        run: make mod-verify

      - name: go mod tidy check
        run: make tidy-check

      - name: go test
        run: make test

      - name: go test -race
        run: make test-race

      - name: govulncheck
        uses: golang/govulncheck-action@b625fbe770f3cfe4bf29bea45caac5ba280045b3 # v1.0.5
        with:
          go-version-file: go.mod

  plugin-validity:
    name: Plugin manifests (schema + compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be7b907ab1ce9b6c7f5e4a0c6e0c5e8b1 # v5.6.0
        with:
          python-version: '3.x'
      - name: Plugin manifest + wrapper syntax
        run: make plugin-syntax-check
      - name: Codex manifest schema validation
        run: |
          python3 -c "
          import json, sys
          m = json.load(open('plugins/codex/.codex-plugin/plugin.json'))
          # Top-level required fields.
          for key in ('name', 'version', 'description', 'author'):
              assert key in m, f'missing top-level {key}'
          # Skills path must be present.
          assert 'skills' in m, 'missing skills path'
          # The current Codex plugin contract rejects unsupported fields such as
          # 'hooks'. Only allow the documented top-level keys.
          allowed_top = {'name', 'version', 'description', 'author', 'skills', 'interface'}
          unsupported = set(m.keys()) - allowed_top
          assert not unsupported, f'unsupported top-level field(s): {unsupported}'
          # Interface metadata is required by the current Codex plugin contract.
          iface = m.get('interface', {})
          allowed_iface = {'displayName', 'shortDescription', 'longDescription', 'developerName', 'category', 'capabilities', 'defaultPrompt'}
          unsupported_iface = set(iface.keys()) - allowed_iface
          assert not unsupported_iface, f'unsupported interface field(s): {unsupported_iface}'
          for key in allowed_iface:
              assert key in iface, f'missing interface.{key}'
          assert isinstance(iface['capabilities'], list) and len(iface['capabilities']) > 0, 'capabilities must be a non-empty list'
          assert isinstance(iface['defaultPrompt'], list) and len(iface['defaultPrompt']) > 0, 'defaultPrompt must be a non-empty list'
          print('Codex manifest satisfies the current plugin contract.')
          "

  bench:
    name: Benchmarks (latency gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run latency benchmarks
        run: make bench-ci

  build-static:
    name: Static build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Static build with ldd verification
        run: make build
      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: fi-linux-amd64
          path: build/fi
          if-no-files-found: error

  cross-build:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.target }}
        run: make build-${{ matrix.target }}
      - name: Verify static linkage
        run: |
          file build/fi-${{ matrix.target }}
          if file build/fi-${{ matrix.target }} | grep -q "dynamically linked"; then
            echo "error: ${{ matrix.target }} binary is dynamically linked"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: fi-${{ matrix.target }}
          path: build/fi-${{ matrix.target }}
          if-no-files-found: error

  pr-packaging:
    name: Packaging (PR validation)
    needs:
      - lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build test artifacts
        run: |
          VERSION=0.0.0 make package
      - name: Validate archive contents
        run: |
          set -euo pipefail
          for f in release/*.tar.gz; do
            echo "Checking $f"
            tar tzf "$f" | head -5
          done
          # SBOM and provenance must be generated
          test -f release/sbom.spdx.json
          test -f release/provenance.intoto.jsonl
      - name: Upload artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-artifacts-pr
          path: release/
          if-no-files-found: warn

  pr-plugin-clean-install:
    name: Plugin clean-install smoke (PR)
    needs:
      - lint-and-test
      - pr-packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build package + plugin clean-install smoke
        run: |
          VERSION=0.0.0 make plugin-clean-install

  release:
    name: Release (on tag)
    needs:
      - lint-and-test
      - plugin-validity
      - build-static
      - cross-build
      - bench
      - pr-packaging
      - pr-plugin-clean-install
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run release gate and package
        run: make release
      - name: Upload GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v2.0.0
        with:
          files: release/*
          draft: true
