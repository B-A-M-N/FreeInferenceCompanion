name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, vet, test, race, govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify clean working tree (no whitespace errors)
        run: git diff --check

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: go mod verify
        run: make mod-verify

      - name: go mod tidy check
        run: make tidy-check

      - name: go test
        run: make test

      - name: go test -race
        run: make test-race

      - name: govulncheck
        uses: golang/govulncheck-action@b625fbe770f3cfe4bf29bea45caac5ba280045b3 # v1.0.5
        with:
          go-version-file: go.mod

  plugin-syntax-check:
    name: Plugin manifests & wrappers (syntax only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be7b907ab1ce9b6c7f5e4a0c6e0c5e8b1 # v5.6.0
        with:
          python-version: '3.x'
      - run: make plugin-syntax-check
      - name: Note (no runtime plugin validation)
        run: |
          echo "WARNING: this job only parses manifests and bash scripts."
          echo "It does NOT validate either plugin against the vendor's runtime."
          echo "Codex plugin-local hooks are not loaded by the current Codex"
          echo "runtime; see README for the Codex architecture status."

  build-static:
    name: Static build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Static build with ldd verification
        run: make build
      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: fi-linux-amd64
          path: build/fi
          if-no-files-found: error

  cross-build:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.target }}
        run: make build-${{ matrix.target }}
      - name: Verify static linkage
        run: |
          file build/fi-${{ matrix.target }}
          if file build/fi-${{ matrix.target }} | grep -q "dynamically linked"; then
            echo "error: ${{ matrix.target }} binary is dynamically linked"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: fi-${{ matrix.target }}
          path: build/fi-${{ matrix.target }}
          if-no-files-found: error

  release-checksums:
    name: Generate checksums (on tag)
    # Tagged releases must pass EVERY gate that runs locally on `make release`,
    # not just the build jobs. A green tag should mean the same thing as a
    # green local release.
    needs:
      - lint-and-test
      - plugin-syntax-check
      - build-static
      - cross-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: build
          merge-multiple: false
      - name: Collect release artifacts
        run: |
          mkdir -p release
          find build -type f -name 'fi-*' -exec cp {} release/ \;
          ls -la release/
      - name: Generate checksums
        run: |
          cd release
          sha256sum fi-* > checksums.txt
          cat checksums.txt
      - name: Upload checksums
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: checksums
          path: release/checksums.txt
          if-no-files-found: error
